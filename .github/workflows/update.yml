name: Update IPTV Playlists

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Filter
        run: |
          python -u filter.py

      - name: Show Statistics
        run: |
          cat stats.json

      - name: Commit Results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add Hindi-HD-Playable.m3u
          git add Hindi-FullHD-Playable.m3u
          git add Hindi-4K-Playable.m3u
          git add report.txt
          git add stats.json

          git commit -m "Update playable playlists" || exit 0
          git push
