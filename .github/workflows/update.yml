name: Update Hindi 4K Playlist

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate playlist
        run: |
          python filter.py

      - name: Commit updates
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add Hindi-True-4K.m3u
          git commit -m "Auto-update Hindi 4K playlist" || exit 0
          git push
